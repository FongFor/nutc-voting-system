# ============================================================
# NUTC Voting System — docker-compose.yml
#
# 所有可調整的參數（候選人、Port、時間）均由 config.json 統管。
# 此檔案僅負責容器編排；業務參數由各服務啟動時自動從
# config.json 讀取，無需在此重複設定。
#
# 網路曝露策略（重要）：
#   本檔案本身「不」對外發布 ca/tpa/ta/cc/admin/voter/bb 的 port，
#   只有 caddy（reverse proxy，見 Caddyfile）對外開 80/443，統一
#   做 TLS termination，並只把請求轉給 voter（選民端）跟 bb（公告
#   板）——CA/TPA/TA/CC/Admin 只能透過 Docker 內部網路被其他容器
#   呼叫，外部連不到。這是「正式部署」的安全預設值：
#     docker compose -f docker-compose.yml up -d --build
#
#   本機開發／測試時，docker-compose.override.yml 會被自動疊加
#   （不需加任何參數，直接 `docker compose up` 就會套用），把每個
#   服務原本的 localhost:<port> 都補回來，行為與加 Caddy 之前完全
#   一樣，測試腳本（test/test_comprehensive.py 等直接打 local port
#   的工具）不需要修改。
#
# Config Hot-Reload：
#   config.json 以唯讀方式掛載進所有容器（/app/config.json）。
#   各服務透過 shared/config_loader.py 的 _HotReloadConfig 機制，
#   每次存取時自動偵測 mtime 變更並重新載入，無需重啟容器。
#   強制重載：POST /api/config/reload
#
# 時區設定：
#   TZ=Asia/Taipei 確保容器內 Python 時區正確（UTC+8）。
#   DISPLAY_TIMEZONE_OFFSET=8 作為備援，供 ts_to_human() 使用。
#
# 快速指令：
#   本機測試（含直連 port）：  docker compose up --build
#   正式部署（僅 Caddy 對外）：docker compose -f docker-compose.yml up -d --build
#   重置：  python reset.py
#   模擬：  python simulate_voters.py
# ============================================================

# ── 共用環境變數（YAML Anchor）────────────────────────────────
x-common-env: &common-env
  PYTHONPATH: /app
  # 時區設定（雙重保險）
  TZ: "Asia/Taipei"
  DISPLAY_TIMEZONE_OFFSET: "8"
  # 注意：CANDIDATES 已移除，改由 config.json 動態讀取（hot-reload）
  # 若需覆蓋，可在各服務的 environment 區塊加入：
  #   CANDIDATES: "Candidate_A,Candidate_B,Candidate_C"

x-service-urls: &service-urls
  CA_URL:  http://ca:5001
  TPA_URL: http://tpa:5000
  TA_URL:  http://ta:5002
  CC_URL:  http://cc:5003
  BB_URL:  http://bb:5004

services:

  # ── 1. 憑證授權中心 (CA) ─────────────────────────────────
  ca:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_ca
    command: python ca_server/app.py
    environment:
      <<: *common-env
    volumes:
      - ca_keys:/app/ca_server/keys
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/ca_cert')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. 第三方機構 (TPA) ──────────────────────────────────
  tpa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_tpa
    command: python tpa_server/app.py
    environment:
      <<: [*common-env, *service-urls]
      # DELTA_T 未設定時，tpa_server 會自動從 config.json timing.delta_t_seconds 讀取
      # 若需臨時覆蓋，可取消下行註解並修改數值：
      # DELTA_T: "300"
    volumes:
      - tpa_keys:/app/tpa_server/keys
      - ./config.json:/app/config.json:ro
    depends_on:
      ca:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/public_key')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 3. 時間授權中心 (TA) ─────────────────────────────────
  ta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_ta
    command: python ta_server/app.py
    environment:
      <<: [*common-env, *service-urls]
      # VOTE_DURATION_SECONDS 未設定時，ta_server 會自動從 config.json timing.vote_duration_seconds 讀取
      # 若需臨時覆蓋，可取消下行註解並修改數值：
      # VOTE_DURATION_SECONDS: "120"
    volumes:
      - ta_keys:/app/ta_server/keys
      - ./config.json:/app/config.json:ro
    depends_on:
      ca:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5002/api/deadline')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 4. 計票中心 (CC) ─────────────────────────────────────
  cc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_cc
    command: python cc_server/app.py
    environment:
      <<: [*common-env, *service-urls]
    volumes:
      - cc_keys:/app/cc_server/keys
      - ./config.json:/app/config.json:ro
    depends_on:
      ca:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5003/api/public_key')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 5. 公告板 (BB) ───────────────────────────────────────
  bb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_bb
    command: python bb_server/app.py
    environment:
      <<: *common-env
      CA_URL: http://ca:5001
      CC_URL: http://cc:5003
    volumes:
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5004/api/results')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 6. 選民端（共用，多使用者透過同一服務投票）────────────
  voter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_voter
    command: python voter_client/app.py
    environment:
      <<: [*common-env, *service-urls]
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      ca:
        condition: service_healthy
      tpa:
        condition: service_healthy
      ta:
        condition: service_healthy
      cc:
        condition: service_healthy
    restart: unless-stopped

  # ── 9.  (Admin Tool) ─────────────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_admin
    command: python admin_tool/app.py
    environment:
      <<: *common-env
      CA_URL: http://ca:5001
      TA_URL: http://ta:5002
      CC_URL: http://cc:5003
      BB_URL: http://bb:5004
      VOTER_URL: http://voter:5005
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      ca:
        condition: service_healthy
      ta:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5010/api/voters')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 10. Reverse Proxy / TLS Termination (Caddy) ──────────
  # 唯一對外開 80/443 的容器。本地測試用內建本地 CA 自動簽發憑證，
  # 未來設定 SITE_ADDRESS / BB_ADDRESS 為真實網域後，會自動改申請
  # Let's Encrypt 正式憑證，Caddyfile 不需要再改。
  caddy:
    image: caddy:2-alpine
    container_name: voting_caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      BB_ADDRESS:   ${BB_ADDRESS:-bb.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      voter:
        condition: service_started
      bb:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes（只保留金鑰，資料庫隨容器生滅）────────────
volumes:
  ca_keys:
  tpa_keys:
  ta_keys:
  cc_keys:
  caddy_data:
  caddy_config:
