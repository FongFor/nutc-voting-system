# ============================================================
# NUTC Voting System — docker-compose.yml
#
# 所有可調整的參數（候選人、Port、時間）均由 config.json 統管。
# 此檔案僅負責容器編排；業務參數由各服務啟動時自動從
# config.json 讀取，無需在此重複設定。
#
# 網路曝露策略（重要）：
#   本檔案本身「不」對外發布 ca/tpa/ta/cc/admin/voter/bb 的 port，
#   只有 caddy（reverse proxy，見 Caddyfile）對外開 80/443，統一
#   做 TLS termination，並只把請求轉給 voter（選民端）跟 bb（公告
#   板）——CA/TPA/TA/CC/Admin 只能透過 Docker 內部網路被其他容器
#   呼叫，外部連不到。這是「正式部署」的安全預設值：
#     docker compose -f docker-compose.yml up -d --build
#
#   本機開發／測試時，docker-compose.override.yml 會被自動疊加
#   （不需加任何參數，直接 `docker compose up` 就會套用），把每個
#   服務原本的 localhost:<port> 都補回來，行為與加 Caddy 之前完全
#   一樣，測試腳本（test/test_comprehensive.py 等直接打 local port
#   的工具）不需要修改。
#
# Config Hot-Reload：
#   config.json 以唯讀方式掛載進所有容器（/app/config.json）。
#   各服務透過 shared/config_loader.py 的 _HotReloadConfig 機制，
#   每次存取時自動偵測 mtime 變更並重新載入，無需重啟容器。
#   強制重載：POST /api/config/reload
#
# 時區設定：
#   TZ=Asia/Taipei 確保容器內 Python 時區正確（UTC+8）。
#   DISPLAY_TIMEZONE_OFFSET=8 作為備援，供 ts_to_human() 使用。
#
# 快速指令：
#   本機測試（含直連 port）：  docker compose up --build
#   正式部署（僅 Caddy 對外）：docker compose -f docker-compose.yml up -d --build
#   重置：  python reset.py
#   模擬：  python simulate_voters.py
# ============================================================

# ── 共用環境變數（YAML Anchor）────────────────────────────────
x-common-env: &common-env
  PYTHONPATH: /app
  # 時區設定（雙重保險）
  TZ: "Asia/Taipei"
  DISPLAY_TIMEZONE_OFFSET: "8"
  # 注意：CANDIDATES 已移除，改由 config.json 動態讀取（hot-reload）
  # 若需覆蓋，可在各服務的 environment 區塊加入：
  #   CANDIDATES: "Candidate_A,Candidate_B,Candidate_C"
  #
  # 上線前驗收發現：這兩個變數過去雖然在 shared/config_loader.py 裡有
  # 「優先讀環境變數，沒有才退回 config.json」的邏輯，也在 config.json
  # 的註解裡寫著「正式環境請改用環境變數覆蓋」，但 docker-compose.yml
  # 從未真的把它們轉送進任何容器——就算在 .env 填上真正的值，容器內部
  # os.environ.get(...) 永遠讀不到，最後還是會用回 config.json 裡那組
  # 教學用預設值。這裡補上 ${VAR} 轉送，讓 .env 真正生效；刻意不在這裡
  # 另外寫一份預設字串（如 ${ADMIN_API_TOKEN:-dev-admin-token-CHANGE-ME}）
  # ——那樣會讓預設值同時存在 docker-compose.yml 與 config.json 兩處，日
  # 後只改一邊會悄悄產生分歧。.env 未設定時保留空字串，讓
  # get_admin_api_token() 原本「環境變數為空就退回 config.json」的邏輯
  # 繼續生效，config.json 仍是唯一的預設值來源。 <3
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
  SERVICE_REGISTRATION_TOKEN: ${SERVICE_REGISTRATION_TOKEN:-}

# v4.0 修正：全部改為 https://——服務間不再靠 Docker 網路隔離當唯一防線
# （見 v4.0 規格書第 26 章），每個服務現在都用 shared/tls_utils.py 核發
# 的獨立 TLS 專用金鑰對做 mTLS，跟原本用來簽應用層封包的身分金鑰對完全
# 分開。
x-service-urls: &service-urls
  CA_URL:  https://ca:5001
  TPA_URL: https://tpa:5000
  TA_URL:  https://ta:5002
  CC_URL:  https://cc:5003
  BB_URL:  https://bb:5004

services:

  # ── 1. 憑證授權中心 (CA) ─────────────────────────────────
  ca:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_ca
    command: python ca_server/app.py
    environment:
      <<: *common-env
    volumes:
      - ca_keys:/app/ca_server/keys
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import ssl, urllib.request; urllib.request.urlopen('https://localhost:5001/api/ca_cert', context=ssl._create_unverified_context())"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. 第三方機構 (TPA) ──────────────────────────────────
  tpa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_tpa
    command: python tpa_server/app.py
    environment:
      <<: [*common-env, *service-urls]
      # DELTA_T 未設定時，tpa_server 會自動從 config.json timing.delta_t_seconds 讀取
      # 若需臨時覆蓋，可取消下行註解並修改數值：
      # DELTA_T: "300"
    volumes:
      - tpa_keys:/app/tpa_server/keys
      - ./config.json:/app/config.json:ro
    depends_on:
      ca:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import ssl, urllib.request; ctx = ssl._create_unverified_context(); ctx.load_cert_chain('/app/tpa_server/keys/tls_certificate.pem', '/app/tpa_server/keys/tls_private_key.pem'); urllib.request.urlopen('https://localhost:5000/api/public_key', context=ctx)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 3. 時間授權中心 (TA) ─────────────────────────────────
  ta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_ta
    command: python ta_server/app.py
    environment:
      <<: [*common-env, *service-urls]
      # VOTE_DURATION_SECONDS 未設定時，ta_server 會自動從 config.json timing.vote_duration_seconds 讀取
      # 若需臨時覆蓋，可取消下行註解並修改數值：
      # VOTE_DURATION_SECONDS: "120"
    volumes:
      - ta_keys:/app/ta_server/keys
      - ./config.json:/app/config.json:ro
    depends_on:
      ca:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import ssl, urllib.request; ctx = ssl._create_unverified_context(); ctx.load_cert_chain('/app/ta_server/keys/tls_certificate.pem', '/app/ta_server/keys/tls_private_key.pem'); urllib.request.urlopen('https://localhost:5002/api/deadline', context=ctx)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 4. 計票中心 (CC) ─────────────────────────────────────
  cc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_cc
    command: python cc_server/app.py
    environment:
      <<: [*common-env, *service-urls]
    volumes:
      - cc_keys:/app/cc_server/keys
      - ./config.json:/app/config.json:ro
    depends_on:
      ca:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import ssl, urllib.request; ctx = ssl._create_unverified_context(); ctx.load_cert_chain('/app/cc_server/keys/tls_certificate.pem', '/app/cc_server/keys/tls_private_key.pem'); urllib.request.urlopen('https://localhost:5003/api/public_key', context=ctx)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 5. 公告板 (BB) ───────────────────────────────────────
  bb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_bb
    command: python bb_server/app.py
    environment:
      <<: *common-env
      CA_URL: https://ca:5001
      CC_URL: https://cc:5003
    volumes:
      - ./config.json:/app/config.json:ro
      # v4.0 新增：BB 現在也持有一把 TLS 專用金鑰對（見
      # shared/tls_utils.py），必須跟其他服務一樣掛持久 volume——沒有
      # 這個掛載，容器一重建金鑰就消失，但 CA 端記得「BB 已經核發過
      # TLS 憑證」（一次性 token 已用掉），會導致永久拿不到新憑證。
      - bb_keys:/app/bb_server/keys
    depends_on:
      ca:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import ssl, urllib.request; urllib.request.urlopen('https://localhost:5004/api/results', context=ssl._create_unverified_context())"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 6. 選民端（共用，多使用者透過同一服務投票）────────────
  voter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_voter
    command: python voter_client/app.py
    environment:
      <<: [*common-env, *service-urls]
    volumes:
      - ./config.json:/app/config.json:ro
      - voter_keys:/app/voter_client/keys  # <3 v4.0：同上，TLS 金鑰對需要持久化
    depends_on:
      ca:
        condition: service_healthy
      tpa:
        condition: service_healthy
      ta:
        condition: service_healthy
      cc:
        condition: service_healthy
    restart: unless-stopped

  # ── 9.  (Admin Tool) ─────────────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_admin
    command: python admin_tool/app.py
    environment:
      <<: *common-env
      CA_URL: https://ca:5001
      TA_URL: https://ta:5002
      CC_URL: https://cc:5003
      BB_URL: https://bb:5004
      VOTER_URL: https://voter:5005
    volumes:
      - ./config.json:/app/config.json:ro
      - admin_keys:/app/admin_tool/keys  # <3 v4.0：同上，TLS 金鑰對需要持久化
    depends_on:
      ca:
        condition: service_healthy
      ta:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import ssl, urllib.request; urllib.request.urlopen('https://localhost:5010/api/voters', context=ssl._create_unverified_context())"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 10. Reverse Proxy / TLS Termination (Caddy) ──────────
  # 唯一對外開 80/443 的容器。本地測試用內建本地 CA 自動簽發憑證，
  # 未來設定 SITE_ADDRESS / BB_ADDRESS 為真實網域後，會自動改申請
  # Let's Encrypt 正式憑證，Caddyfile 不需要再改。
  caddy:
    image: caddy:2-alpine
    container_name: voting_caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      BB_ADDRESS:   ${BB_ADDRESS:-bb.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # v4.0 新增：唯讀掛載 CA 的 keys volume，讓 Caddy 能讀到
      # ca_root_cert.pem 去驗證 voter/bb 的 TLS 伺服器憑證（見
      # Caddyfile 的 tls_trusted_ca_certs 設定）。
      - ca_keys:/certs:ro
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      ca:
        condition: service_healthy
      voter:
        condition: service_started
      bb:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes（只保留金鑰，資料庫隨容器生滅）────────────
volumes:
  ca_keys:
  tpa_keys:
  ta_keys:
  cc_keys:
  bb_keys:      # <3 v4.0
  voter_keys:   # <3 v4.0
  admin_keys:   # <3 v4.0
  caddy_data:
  caddy_config:
